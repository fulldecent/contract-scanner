# Git dependencies are refused unless the repository URL matches a pattern here.
# "**" approves every repository.
# https://yarnpkg.com/configuration/yarnrc#approvedGitRepositories
approvedGitRepositories:
  - "**"

# Yarn 4.14 does not run dependency scripts unless this is set.
# https://yarnpkg.com/features/security
enableScripts: true

# Yarn 4.12 defaults this to one day, so a package published today is refused.
# https://yarnpkg.com/features/security
npmMinimalAgeGate: 0
