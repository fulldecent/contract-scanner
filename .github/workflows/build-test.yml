# Build and test
#
# Install, test, pack, and SLSA attest the project.
#
# This workflow produces the following things which release.yml consumes:
#   1. $.jobs.build-test (this exact job ID)
#   2. The artifact named "build"
#
# Public repositories can use attest for free. Private repos require Enterprise Cloud.
#
# The packed file is contract-scanner.tgz. node.js-template packs simple-rpn-calculator.tgz
# because that is the template's package name.

name: Build and test

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out this commit
        uses: actions/checkout@v7

      # Update this when Yarn no longer recommends Corepack
      # See: https://yarnpkg.com/getting-started/install
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test
        run: yarn test

      - name: Pack
        run: |
          mkdir -p dist
          yarn pack --out dist/contract-scanner.tgz

      - name: Attest the build
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      # After attesting, so the bundle is not one of its own subjects.
      - name: Add the attestation to the build
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/attestation.sigstore.json

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: dist/
          if-no-files-found: error
          retention-days: 14
